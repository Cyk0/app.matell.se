<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app.matell.se</title>
<meta name="description" content="Small web apps and tools.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --fg: #1c1b19;
    --muted: #6b6862;
    --line: #e4e1db;
    --card: #ffffff;
    --card-hover: #f6f4f0;
    --accent: #b4530a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --fg: #edeae4;
      --muted: #9a958c;
      --line: #2c2a27;
      --card: #1e1d1a;
      --card-hover: #262420;
      --accent: #e08a45;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px 96px; }
  header { margin-bottom: 48px; }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .tagline { margin: 0; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.app {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    transition: background .15s ease, transform .15s ease;
  }
  a.app:hover { background: var(--card-hover); transform: translateY(-1px); }
  .app-name { font-weight: 600; letter-spacing: -0.01em; }
  .app-desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .empty {
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 28px 20px;
    color: var(--muted);
    text-align: center;
    font-size: 14px;
  }
  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>app.matell.se</h1>
    <p class="tagline">Small web apps and tools.</p>
  </header>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No apps listed yet. Add one to <code>apps.json</code>.</div>

  <footer>Each app is a folder in this repository. Add a folder, add a line to <code>apps.json</code>, and it shows up here.</footer>
</div>

<script>
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  fetch('apps.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(apps => {
      if (!Array.isArray(apps) || apps.length === 0) { empty.hidden = false; return; }
      for (const app of apps) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'app';
        a.href = app.slug.replace(/^\/+|\/+$/g, '') + '/';

        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = app.name || app.slug;
        a.appendChild(name);

        if (app.description) {
          const d = document.createElement('div');
          d.className = 'app-desc';
          d.textContent = app.description;
          a.appendChild(d);
        }
        li.appendChild(a);
        list.appendChild(li);
      }
    })
    .catch(() => { empty.hidden = false; });
</script>
</body>
</html>
